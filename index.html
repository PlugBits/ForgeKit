<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Quote Tools</title><meta name="theme-color" content="#1f2937"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"></head><body><header><div><h1>Simple Quote Tools</h1><p>見積・重量・単位換算をすばやく計算</p></div><button id="installBtn" class="ghost hidden">インストール</button></header><nav><button class="tab active" data-tab="quote">見積</button><button class="tab" data-tab="weight">重量</button><button class="tab" data-tab="convert">単位換算</button><button class="tab" data-tab="settings">設定</button></nav><main>
<section id="quote" class="panel active"><div class="card"><h2>加工見積</h2><label>見積タイプ</label><select id="quoteType"><option value="welding">溶接</option><option value="machining">加工：マシニング</option><option value="lathe">加工：旋盤</option><option value="press">プレス加工</option></select><div class="grid"><div><label>数量 pcs</label><input id="qQty" type="number" value="1" min="1"></div><div><label>材料費 / pc</label><input id="qMaterialEach" type="number" value="0" step="any"></div></div><h3>時間計算</h3><div class="grid"><div><label>段取り時間 min</label><input id="setupMin" type="number" step="any"></div><div><label>加工時間 sec / pc</label><input id="cycleSec" type="number" step="any"></div><div><label>時間単価 / hr</label><input id="hourRate" type="number" step="any"></div><div><label>検査・梱包 sec / pc</label><input id="inspectSec" type="number" step="any"></div></div><h3>追加費用</h3><div class="grid"><div><label>消耗品・工具費</label><input id="consumable" type="number" value="0" step="any"></div><div><label>外注・表面処理</label><input id="outsideCost" type="number" value="0" step="any"></div><div><label>管理費 %</label><input id="qOverhead" type="number" value="10" step="any"></div><div><label>利益率 %</label><input id="qProfit" type="number" value="20" step="any"></div></div><p id="quoteHints" class="note"></p><div class="result vertical"><div><span>総時間</span><strong id="totalHours">0 hr</strong></div><div><span>加工費</span><strong id="laborCost">$0.00</strong></div><div><span>材料費</span><strong id="qMaterialCost">$0.00</strong></div><div><span>見積合計</span><strong id="quoteTotal">$0.00</strong></div><div><span>単価</span><strong id="quoteUnit">$0.00 / pc</strong></div></div><button id="copyQuote" class="primary">見積結果をコピー</button></div><div class="card"><h2>数量別 単価目安</h2><div id="qtyBreaks" class="break-grid"></div></div></section>
<section id="weight" class="panel"><div class="card"><h2>重量計算</h2><label>形状</label><select id="shape"><option value="plate">板材 / フラットバー</option><option value="round">丸棒</option><option value="square">角材</option><option value="hex">六角材</option><option value="roundPipe">丸パイプ</option><option value="squarePipe">角パイプ</option></select><label>材質</label><select id="material"></select><div id="shapeInputs" class="grid"></div><label>数量</label><input id="qty" type="number" min="1" value="1"><div class="result"><div><span>1個あたり</span><strong id="weightEach">0 kg</strong></div><div><span>合計</span><strong id="weightTotal">0 kg</strong></div></div><button id="copyWeight" class="primary">結果をコピー</button></div></section>
<section id="convert" class="panel"><div class="card"><h2>単位換算</h2><label>カテゴリ</label><select id="convertType"><option value="length">長さ</option><option value="weight">重量</option><option value="pressure">圧力</option><option value="temperature">温度</option></select><div class="converter"><input id="convertValue" type="number" step="any" placeholder="値を入力"><select id="convertFrom"></select><span>→</span><select id="convertTo"></select></div><div class="single-result"><span>結果</span><strong id="convertResult">0</strong></div><button id="copyConvert" class="primary">結果をコピー</button></div></section>
<section id="settings" class="panel"><div class="card"><h2>設定</h2><h3>時間単価 初期値</h3><div class="grid"><div><label>溶接 / hr</label><input id="rateWelding" type="number"></div><div><label>マシニング / hr</label><input id="rateMachining" type="number"></div><div><label>旋盤 / hr</label><input id="rateLathe" type="number"></div><div><label>プレス / hr</label><input id="ratePress" type="number"></div></div><h3>材質密度</h3><p class="note">密度は g/cm³。重量計算で使用します。</p><div id="materialSettings"></div><button id="saveSettings" class="primary">設定を保存</button><button id="resetSettings" class="ghost">初期値に戻す</button></div></section>
</main><footer>GitHub Pages / PWA Ready</footer><script src="./app.js"></script></body></html>
